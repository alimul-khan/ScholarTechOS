<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- Support your masjid: a donation box with a coin dropping in -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a6e"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".6" r=".55"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c8a6e"/><stop offset="1" stop-color="#0f5c49"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25a985"/><stop offset="1" stop-color="#178466"/></linearGradient>
    <radialGradient id="coin" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe9a3"/><stop offset=".7" stop-color="#f2b934"/><stop offset="1" stop-color="#c98a14"/></radialGradient>
    <pattern id="star" width="140" height="140" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"><rect x="36" y="36" width="68" height="68"/><rect x="36" y="36" width="68" height="68" transform="rotate(45 70 70)"/></g>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#star)"/>
  <rect width="1200" height="900" fill="url(#spot)"/>
  <!-- shadow -->
  <ellipse cx="600" cy="790" rx="300" ry="34" fill="#000" opacity=".35"/>
  <!-- box -->
  <path d="M330 470h540v300a20 20 0 0 1 -20 20H350a20 20 0 0 1 -20 -20z" fill="url(#box)"/>
  <path d="M310 420h580a14 14 0 0 1 14 14v36H296v-36a14 14 0 0 1 14 -14z" fill="url(#lid)"/>
  <rect x="530" y="436" width="140" height="18" rx="9" fill="#0a3d31"/>
  <!-- crescent and star emblem -->
  <circle cx="600" cy="620" r="92" fill="none" stroke="#f2c14e" stroke-width="8"/>
  <path d="M620 560a64 64 0 1 0 0 120a52 52 0 1 1 0 -120z" fill="#f2c14e"/>
  <path d="M640 600l9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3z" fill="#f2c14e"/>
  <!-- coin dropping in -->
  <g transform="rotate(-14 600 300)">
    <ellipse cx="600" cy="300" rx="62" ry="62" fill="url(#coin)" stroke="#b07a10" stroke-width="5"/>
    <ellipse cx="600" cy="300" rx="44" ry="44" fill="none" stroke="#c98a14" stroke-width="4" opacity=".7"/>
  </g>
  <g stroke="#ffe9a3" stroke-width="5" stroke-linecap="round" opacity=".6"><path d="M520 230l-24-24M680 230l24-24M600 200v-36"/></g>
  <!-- small hearts -->
  <path d="M300 300c-18-24-52-8-40 20 6 14 40 38 40 38s34-24 40-38c12-28-22-44-40-20z" fill="#ff7a8a" opacity=".85"/>
  <path d="M920 250c-13-17-37-6-28 14 4 10 28 27 28 27s24-17 28-27c9-20-15-31-28-14z" fill="#ff7a8a" opacity=".7"/>
</svg>
