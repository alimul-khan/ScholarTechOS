; Prayer display firmware for the Waveshare ESP32-S3-Touch-LCD-4B (480x480 touch screen).
; Build: pio run          Flash: pio run -t upload          Logs: pio device monitor
; Settings page and files: pio run -t uploadfs (see README.md)

[env:lcd4b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 6029312
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Flash write test: build_flags = -DFLASH_STRESS
