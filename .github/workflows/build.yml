name: Build ScholarTechOS

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  BR_VERSION: "2025.02.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rpi4
            defconfig: raspberrypi4_64_defconfig
          - board: zero2w
            defconfig: raspberrypizero2w_64_defconfig
    name: build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget cpio unzip rsync bc file patch perl python3 \
            libncurses-dev libssl-dev ca-certificates sed gzip bzip2 xz-utils \
            cmake ninja-build pkg-config

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: ~/br-dl
          key: br-dl-${{ env.BR_VERSION }}-${{ hashFiles('configs/*.config') }}
          restore-keys: br-dl-${{ env.BR_VERSION }}-

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-${{ env.BR_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.board }}-${{ env.BR_VERSION }}-

      - name: Get Buildroot
        run: git clone --depth 1 --branch "$BR_VERSION" https://gitlab.com/buildroot.org/buildroot.git ~/buildroot

      - name: Configure
        run: |
          cd ~/buildroot
          export BR2_EXTERNAL="$GITHUB_WORKSPACE"
          make O=~/out ${{ matrix.defconfig }}
          cat "$GITHUB_WORKSPACE/configs/common.config" "$GITHUB_WORKSPACE/configs/${{ matrix.board }}.config" >> ~/out/.config
          echo 'BR2_DL_DIR="$(HOME)/br-dl"' >> ~/out/.config
          echo 'BR2_CCACHE=y' >> ~/out/.config
          echo 'BR2_CCACHE_DIR="$(HOME)/.buildroot-ccache"' >> ~/out/.config
          make O=~/out olddefconfig
          # Fail fast if Buildroot silently dropped any option we asked for
          bad=0
          for k in $(cat "$GITHUB_WORKSPACE/configs/common.config" "$GITHUB_WORKSPACE/configs/${{ matrix.board }}.config" | grep -oE '^BR2_[A-Z0-9_]+=y' | cut -d= -f1); do
            grep -q "^$k=y" ~/out/.config || { echo "::error::Option dropped by Buildroot: $k"; bad=1; }
          done
          exit $bad

      - name: Build
        run: |
          cd ~/buildroot
          export BR2_EXTERNAL="$GITHUB_WORKSPACE"
          make O=~/out -j"$(nproc)"

      - name: Compress image
        run: |
          cp ~/out/images/sdcard.img ~/out/images/scholartechos-${{ matrix.board }}.img
          xz -T0 -k ~/out/images/scholartechos-${{ matrix.board }}.img

      - uses: actions/upload-artifact@v4
        with:
          name: scholartechos-${{ matrix.board }}
          path: ~/out/images/scholartechos-${{ matrix.board }}.img.xz

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.board }}
          path: ~/out/build/build-time.log
          if-no-files-found: ignore
